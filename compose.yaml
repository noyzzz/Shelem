name: shelem

services:
  web:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      GAME_SERVER_URL: http://game-server:3001
    depends_on:
      game-server:
        condition: service_healthy
    networks:
      - shelem

  game-server:
    build:
      context: .
      target: game-server
    environment:
      NODE_ENV: production
      PORT: 3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - shelem

  web-production:
    profiles:
      - production
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    depends_on:
      game-server:
        condition: service_healthy
    networks:
      - shelem

volumes:
  web_node_modules:

networks:
  shelem:
    name: shelem
