name: shelem

services:
  web:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
    networks:
      - shelem

  web-production:
    profiles:
      - production
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    networks:
      - shelem

volumes:
  web_node_modules:

networks:
  shelem:
    name: shelem

