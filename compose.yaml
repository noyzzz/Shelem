name: shelem

services:
  web:
    build:
      context: .
      target: development
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      GAME_SERVER_URL: http://game-server:3001
    depends_on:
      game-server:
        condition: service_healthy
    networks:
      - shelem

  game-server:
    build:
      context: .
      target: game-server
    environment:
      NODE_ENV: production
      PORT: 3001
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      DATABASE_URL: ${DATABASE_URL:-postgres://shelem:shelem@postgres:5432/shelem}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shelem

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shelem
      POSTGRES_PASSWORD: shelem
      POSTGRES_DB: shelem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelem -d shelem"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shelem

  livekit:
    image: livekit/livekit-server:v1.13.1
    command:
      - --dev
      - --bind
      - 0.0.0.0
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
      - --udp-port
      - "7882"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - shelem

  web-production:
    profiles:
      - production
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    depends_on:
      game-server:
        condition: service_healthy
    networks:
      - shelem

volumes:
  web_node_modules:
  postgres_data:

networks:
  shelem:
    name: shelem
